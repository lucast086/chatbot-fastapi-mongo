server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Don't advertise the version in every response.
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # The SPA has no server-side routes, but a reload on any path has to return
    # index.html rather than 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # The longest legal message is 8000 characters; nginx's 1m default is
        # three orders of magnitude more than this API can ever use.
        client_max_body_size 64k;

        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A model can take a while to answer, and the default 60s would cut a
        # slow generation off as a gateway timeout.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Required for server-sent events: without these, nginx buffers the
        # whole response and the stream arrives all at once at the end, which
        # is indistinguishable from no streaming at all.
        proxy_buffering off;
        proxy_cache off;
    }

    # Handy for `docker compose up` users who want to check the backend
    # directly without publishing a second port.
    location /health/ {
        proxy_pass http://api:8000;
    }
}
