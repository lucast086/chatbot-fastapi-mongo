name: chatbot

# Note there is no `env_file:` anywhere in this file. `env_file: .env` fails
# outright when the file does not exist, which would break `docker compose up`
# on a clean clone — the one thing that has to work. Compose interpolates
# ${VAR} from a .env file automatically when one is present and falls back to
# the defaults below when it is not, which is the behaviour we want.

services:
  # The only published port. nginx serves the built frontend and proxies /api
  # to the backend, so there is one origin, no CORS to configure and one URL to
  # give a reviewer.
  web:
    build:
      context: ./frontend
    # Bound to the loopback interface, not 0.0.0.0. Docker publishes ports by
    # inserting rules into the DOCKER iptables chain, which is traversed before
    # ufw/firewalld — so a host firewall does not contain a published port, and
    # `docker compose up` on café or office Wi-Fi would otherwise expose this
    # stack to everyone on the segment.
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: .
      target: runtime
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # The service name, not localhost: this resolves on the compose network.
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: ${MONGO_DB:-chatbot}
      # The one value with no working default. Absent, the app still starts and
      # everything except message generation works.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      # Tried in order. Free models are rate limited per model, so the second
      # usually answers the moment the first says 429.
      OPENROUTER_MODELS: ${OPENROUTER_MODELS:-google/gemma-4-31b-it:free,google/gemma-4-26b-a4b-it:free,inclusionai/ling-3.0-tiny:free}
      SYSTEM_PROMPT: ${SYSTEM_PROMPT:-You are a helpful assistant. Answer clearly and concisely.}
      MAX_MESSAGE_LENGTH: ${MAX_MESSAGE_LENGTH:-8000}
      MAX_OUTPUT_TOKENS: ${MAX_OUTPUT_TOKENS:-2048}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-60}
      FIRST_TOKEN_TIMEOUT_SECONDS: ${FIRST_TOKEN_TIMEOUT_SECONDS:-20}
      HISTORY_LIMIT: ${HISTORY_LIMIT:-20}
      MAX_HISTORY_CHARS: ${MAX_HISTORY_CHARS:-24000}
      GENERATE_TITLES: ${GENERATE_TITLES:-true}
    # Published as well as proxied, so Swagger UI at /docs and a direct curl
    # are available without going through nginx. Set API_PORT to change it if
    # something else is already on 8000.
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      mongo:
        # Not a bare `depends_on: [mongo]`. Without `service_healthy`, Compose
        # only waits for the container to start, not for MongoDB to accept
        # connections, and index creation on startup would race it.
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:8
    # No authentication. This stack is a local development and review
    # environment: MongoDB is only reachable from the compose network and from
    # localhost. Credentials here would be committed to the repository, which
    # buys the appearance of security rather than security.
    volumes:
      # A named volume, not a bind mount: conversations have to survive
      # `docker compose down` followed by `up`. `down -v` is what wipes them.
      - mongo-data:/data/db
    # Loopback only, and this binding is what makes the no-authentication choice
    # above defensible rather than aspirational. Published at all purely so a
    # `mongosh` session works from the host; the app reaches it over the compose
    # network by service name and never needs the published port.
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  mongo-data:
